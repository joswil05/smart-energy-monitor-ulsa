[env:esp32dev]
; Versiones fijadas: sin pin, un build de mañana no reproduce el de hoy.
platform = espressif32@6.12.0
board = esp32dev
framework = arduino

monitor_speed = 115200
upload_speed = 921600
; Convierte el backtrace hexadecimal de un Guru Meditation en fichero:linea.
monitor_filters = esp32_exception_decoder, time

; min_spiffs sobre 4 MB deja dos ranuras OTA de 1.875 MB. Al pasar al modulo
; N8 de la PCB propia, sustituir por una tabla de particiones a medida.
board_build.partitions = min_spiffs.csv

build_flags =
  -DCORE_DEBUG_LEVEL=3
  ; Solo se usa Realtime Database. Desactivar los modulos restantes de
  ; Firebase-ESP-Client recorta flash y RAM, que es justo el presupuesto
  ; que aprieta al anadir MQTT y servidor local en fases posteriores.
  -DDISABLE_FCM
  -DDISABLE_FB_STORAGE
  -DDISABLE_GC_STORAGE
  -DDISABLE_FIRESTORE
  -DDISABLE_FB_FUNCTIONS

lib_deps =
  ; Comunicaciones Cloud
  mobizt/Firebase Arduino Client Library for ESP8266 and ESP32 @ 4.4.17
  bblanchon/ArduinoJson @ ^7.0.4

  ; HMI Local (Pantalla OLED)
  adafruit/Adafruit SSD1306 @ ^2.5.9
  adafruit/Adafruit GFX Library @ ^1.11.9
