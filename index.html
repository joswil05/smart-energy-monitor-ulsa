<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>My Google AI Studio App</title>
  <script>
    (function() {
      try {
        var pref = localStorage.getItem('darkModePreference');
        var isDark = pref !== null ? pref === 'true' : true;
        if (isDark) {
          document.documentElement.classList.add('dark');
          document.documentElement.style.backgroundColor = '#0B0F19';
        } else {
          document.documentElement.classList.remove('dark');
          document.documentElement.style.backgroundColor = '#F8FAFC';
        }
      } catch (e) {}
    })();
  </script>
</head>

<body>
  <div id="root"></div>
  <script>
    window.onerror = function (msg, url, lineNo, columnNo, error) {
      var el = document.createElement('div');
      el.style.cssText = 'background: red; color: white; padding: 20px; font-family: monospace; position: absolute; top:0; left:0; right:0; z-index: 9999; word-wrap: break-word;';
      el.innerHTML = '<b>JS ERROR:</b><br>' + msg + '<br><b>Line:</b> ' + lineNo + '<br><b>URL:</b> ' + url + ((error && error.stack) ? '<br><pre>' + error.stack + '</pre>' : '');
      document.body.appendChild(el);
      return false;
    };
    window.addEventListener('unhandledrejection', function (event) {
      var el = document.createElement('div');
      el.style.cssText = 'background: darkred; color: white; padding: 20px; font-family: monospace; position: absolute; top:0; left:0; right:0; z-index: 9999; word-wrap: break-word;';
      el.innerHTML = '<b>PROMISE ERROR:</b><br>' + (event.reason && event.reason.message || event.reason) + ((event.reason && event.reason.stack) ? '<br><pre>' + event.reason.stack + '</pre>' : '');
      document.body.appendChild(el);
    });
  </script>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
